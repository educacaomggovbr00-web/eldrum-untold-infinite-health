name: Eldrum APK analysis and split-package build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing the complete split archive
        required: true
        default: Aaasa
        type: string
      package_asset:
        description: Exact .apks/.apkm/.zip asset filename in the selected Release
        required: true
        default: Eldrum-Untold-Text-Based-RPG_1.11.5_apkcube.apks
        type: string
      expected_sha256:
        description: Expected SHA-256 of the complete source archive
        required: false
        default: db76d30372b9f6b4bebc3071a29ca6caf08fd44d038ddb6ddca424854387e600
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/apk-analysis.yml'
      - 'scripts/**'
      - 'patches/**'

permissions:
  contents: read

concurrency:
  group: eldrum-focused-health-analysis
  cancel-in-progress: true

jobs:
  build:
    name: Validate, patch, and sign complete split package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || 'Aaasa' }}
      PACKAGE_ASSET: ${{ inputs.package_asset || 'Eldrum-Untold-Text-Based-RPG_1.11.5_apkcube.apks' }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 || 'db76d30372b9f6b4bebc3071a29ca6caf08fd44d038ddb6ddca424854387e600' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install build tools
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install and verify Hermes tooling
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 \
            https://github.com/SymbioticSec/hermes-decomp/releases/download/v0.2.4/hermes-decomp-v0.2.4-linux-x86_64.tar.gz \
            -o tools/hermes-decomp.tar.gz
          echo "6e070410432575698657b38d3497f66fd91c0c00f63880d6776703d81d99b5ac  tools/hermes-decomp.tar.gz" | sha256sum -c -
          mkdir -p tools/hermes
          tar -xzf tools/hermes-decomp.tar.gz -C tools/hermes
          HERMES_BIN="$(find "$PWD/tools/hermes" -type f -name hermes-decomp -print -quit)"
          test -n "$HERMES_BIN"
          chmod +x "$HERMES_BIN"
          echo "HERMES_BIN=$HERMES_BIN" >> "$GITHUB_ENV"
          "$HERMES_BIN" --help | head -n 8

      - name: Download complete split archive from Release
        run: |
          set -euo pipefail
          mkdir -p input
          if ! gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$PACKAGE_ASSET" \
            --dir input \
            --clobber; then
            echo "::error::Release asset '$PACKAGE_ASSET' was not found. Upload the complete .apks/.apkm/.zip split archive, not only the base APK." 
            exit 30
          fi
          test -s "input/$PACKAGE_ASSET"
          echo "PACKAGE_PATH=$GITHUB_WORKSPACE/input/$PACKAGE_ASSET" >> "$GITHUB_ENV"

      - name: Validate complete APK split archive
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_SHA256" ]]; then
            echo "$EXPECTED_SHA256  input/$PACKAGE_ASSET" | sha256sum -c -
          fi
          unzip -tq "input/$PACKAGE_ASSET"
          mapfile -t APK_ENTRIES < <(unzip -Z1 "input/$PACKAGE_ASSET" | grep -Ei '\.apk$' || true)
          printf 'Found %s APK entries in source archive.\n' "${#APK_ENTRIES[@]}"
          if (( ${#APK_ENTRIES[@]} < 2 )); then
            echo "::error::This is a single APK, not a complete split package. Missing config APKs cause INSTALL_FAILED_MISSING_SPLIT."
            exit 31
          fi
          echo "Archive entries:"
          unzip -Z1 "input/$PACKAGE_ASSET" | sed -n '1,100p'

      - name: Build the player-only infinite-health split package
        run: |
          set -euo pipefail
          FUNCTION_ID="$(tr -d '[:space:]' < patches/actor-change-health-function-id.txt)"
          bash scripts/build_modified_split_package.sh \
            "$PACKAGE_PATH" \
            patches/actor-change-health.hasm \
            "$FUNCTION_ID" \
            build/output \
            "$HERMES_BIN" \

      - name: Publish signed split APK set
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: eldrum-untold-infinite-health-split-apks
          path: |
            build/output/eldrum-untold-infinite-health.apks
            build/output/apks-sha256.txt
            build/output/splits/*.apk
            build/output/INSTALL-NOTES.txt
            build/output/splits-manifest.txt
            build/output/modified-splits-sha256.txt
            build/output/pairip-signature.txt
            build/output/function-*-after-patch.hasm
          retention-days: 5
          if-no-files-found: error

      - name: Publish original split archive for native ARM64 comparison
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: eldrum-original-split-source
          path: input/${{ env.PACKAGE_ASSET }}
          if-no-files-found: error
          retention-days: 5

  validate-signed-splits:
    name: Validate patched APK splits and PairIP metadata
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGE_ASSET: ${{ inputs.package_asset || 'Eldrum-Untold-Text-Based-RPG_1.11.5_apkcube.apks' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download modified split package
        uses: actions/download-artifact@v4
        with:
          name: eldrum-untold-infinite-health-split-apks
          path: build/output

      - name: Download original split source
        uses: actions/download-artifact@v4
        with:
          name: eldrum-original-split-source
          path: input

      - name: Set up Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install build tools
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate split count, signatures, package IDs, and PairIP CRCs
        run: |
          set -euo pipefail
          test -s build/output/eldrum-untold-infinite-health.apks
          SOURCE="input/${{ env.PACKAGE_ASSET }}"
          test -s "$SOURCE"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          source = Path("input/${{ env.PACKAGE_ASSET }}")
          modified = Path("build/output/eldrum-untold-infinite-health.apks")
          base_source = Path("build/validation/original-base.apk")
          base_modified = Path("build/validation/modified-base.apk")
          base_source.parent.mkdir(parents=True, exist_ok=True)

          for archive, output, label in (
              (source, base_source, "original"),
              (modified, base_modified, "modified"),
          ):
              with zipfile.ZipFile(archive) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"{label} APKS outer ZIP is corrupt at {bad}")
                  apk_entries = [n for n in z.namelist() if n.lower().endswith(".apk")]
                  if len(apk_entries) != 27:
                      raise SystemExit(f"{label} package contains {len(apk_entries)} APKs, expected 27")
                  base_entries = [n for n in apk_entries if Path(n).name == "base.apk"]
                  if len(base_entries) != 1:
                      raise SystemExit(f"{label} archive must contain exactly one base.apk")
                  output.write_bytes(z.read(base_entries[0]))
              print(f"{label}: 27 APK splits; extracted {base_entries[0]}")
          PY

          python3 scripts/preserve_pairip_crc.py \
            build/validation/modified-base.apk \
            build/validation/original-base.apk \
            --entry assets/index.android.bundle \
            --entry classes2.dex \
            --verify

          EXPECTED_CERT=""
          COUNT=0
          for apk in build/output/splits/*.apk; do
            test -s "$apk"
            DETAILS="$(apksigner verify --verbose --print-certs "$apk")"
            CERT="$(printf '%s\n' "$DETAILS" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}')"
            test -n "$CERT"
            if [[ -z "$EXPECTED_CERT" ]]; then
              EXPECTED_CERT="$CERT"
            elif [[ "$CERT" != "$EXPECTED_CERT" ]]; then
              echo "::error::Split APKs have mismatched signing certificates."
              exit 1
            fi
            APP_ID="$(apkanalyzer manifest application-id "$apk")"
            [[ "$APP_ID" == "com.gotterdammerung.untold" ]]
            COUNT=$((COUNT + 1))
          done
          [[ "$COUNT" -eq 27 ]]
          echo "Validated $COUNT signed splits with one shared certificate."
          echo "NOTE: CI validates package integrity only; startup still needs testing on a physical ARM64 phone."
  emulator-startup-diagnostics:
    name: Capture Android startup logs (native ARM64)
    needs: [build, validate-signed-splits]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      PACKAGE_ASSET: ${{ inputs.package_asset || 'Eldrum-Untold-Text-Based-RPG_1.11.5_apkcube.apks' }}
      ARM64_EMULATOR_URL: https://github.com/Changqing-JING/android-emulator-aarch64-linux/releases/download/v2.12.0-19097-g85fa07f04ef/sdk-repo-linux_aarch64-emulator-standalone-0.zip
      ARM64_EMULATOR_SHA256: 67ce4f576687b067d9b36668405b86b9749745d67d31037616aac12c49c63a65
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download modified split package
        uses: actions/download-artifact@v4
        with:
          name: eldrum-untold-infinite-health-split-apks
          path: build/output

      - name: Download original split source
        uses: actions/download-artifact@v4
        with:
          name: eldrum-original-split-source
          path: input

      - name: Set up Java for Android command-line tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools without x86 platform tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install native ARM64 adb and utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y adb unzip curl file
          echo "/usr/bin" >> "$GITHUB_PATH"
          mkdir -p build/emulator-test
          {
            echo "Host architecture: $(uname -m)"
            echo "Host kernel: $(uname -a)"
            echo "Runner label: ubuntu-24.04-arm"
            echo "Android SDK: $ANDROID_HOME"
            echo "Native adb: $(/usr/bin/adb version | head -n 1)"
            echo "KVM device: $(test -r /dev/kvm && test -w /dev/kvm && echo accessible || echo unavailable)"
            echo "Community emulator release: v2.12.0-19097-g85fa07f04ef"
            echo "Community emulator SHA-256: $ARM64_EMULATOR_SHA256"
            echo "Emulator archive source: $ARM64_EMULATOR_URL"
          } | tee build/emulator-test/runner-environment.txt
          test "$(uname -m)" = "aarch64"
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Enable KVM permissions
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install Android 15 ARM64 system image and native Linux ARM64 emulator
        run: |
          set -euo pipefail
          sdkmanager --install "system-images;android-35;google_apis;arm64-v8a"

          ARCHIVE="$RUNNER_TEMP/android-emulator-arm64.zip"
          EXTRACT="$RUNNER_TEMP/android-emulator-arm64"
          mkdir -p "$EXTRACT" "$ANDROID_HOME"
          curl -fL --retry 3 "$ARM64_EMULATOR_URL" -o "$ARCHIVE"
          echo "$ARM64_EMULATOR_SHA256  $ARCHIVE" | sha256sum -c -
          unzip -q "$ARCHIVE" -d "$EXTRACT"

          if [[ -x "$EXTRACT/emulator" ]]; then
            mv "$EXTRACT" "$ANDROID_HOME/emulator"
          elif [[ -x "$EXTRACT/emulator/emulator" ]]; then
            mv "$EXTRACT/emulator" "$ANDROID_HOME/emulator"
          else
            echo "::error::Could not locate the emulator executable in the pinned ARM64 archive."
            find "$EXTRACT" -maxdepth 4 -type f | sort | head -n 100
            exit 51
          fi

          chmod +x "$ANDROID_HOME"/emulator/emulator "$ANDROID_HOME"/emulator/qemu/linux-aarch64/* 2>/dev/null || true
          file "$ANDROID_HOME/emulator/emulator" | tee build/emulator-test/emulator-binary.txt
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee build/emulator-test/emulator-version.txt
          avdmanager create avd \
            --name eldrum-arm64 \
            --package "system-images;android-35;google_apis;arm64-v8a" \
            --device pixel_7 \
            --force

          {
            echo "System image: system-images;android-35;google_apis;arm64-v8a"
            echo "AVD: eldrum-arm64"
            echo "Guest architecture expected: arm64-v8a"
          } | tee build/emulator-test/arm64-avd.txt

      - name: Boot native ARM64 Android and run original vs modified
        run: |
          set -Eeuo pipefail
          mkdir -p build/emulator-test
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/22.0/bin:/usr/bin:$PATH"
          EMULATOR_LOG="$GITHUB_WORKSPACE/build/emulator-test/host-emulator.log"
          "$ANDROID_HOME/emulator/emulator" \
            -avd eldrum-arm64 \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -accel on \
            -memory 4096 \
            -port 5554 \
            > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > build/emulator-test/emulator-host-pid.txt
          cleanup() {
            /usr/bin/adb -s emulator-5554 emu kill >/dev/null 2>&1 || kill "$EMULATOR_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          /usr/bin/adb start-server
          BOOTED=0
          for attempt in $(seq 1 300); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::Native ARM64 emulator exited before Android finished booting."
              tail -n 200 "$EMULATOR_LOG" || true
              exit 52
            fi
            STATE="$(/usr/bin/adb -s emulator-5554 get-state 2>/dev/null || true)"
            if [[ "$STATE" == "device" ]]; then
              BOOT_COMPLETE="$(/usr/bin/adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [[ "$BOOT_COMPLETE" == "1" ]]; then
                BOOTED=1
                break
              fi
            fi
            sleep 2
          done
          if [[ "$BOOTED" -ne 1 ]]; then
            echo "::error::Native ARM64 Android did not finish booting within 10 minutes."
            /usr/bin/adb devices -l > build/emulator-test/adb-devices-on-boot-failure.txt 2>&1 || true
            tail -n 250 "$EMULATOR_LOG" || true
            exit 53
          fi

          {
            echo "Host: $(uname -m)"
            echo "Guest release: $(/usr/bin/adb -s emulator-5554 shell getprop ro.build.version.release | tr -d '\r')"
            echo "Guest API: $(/usr/bin/adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "Guest ABIs: $(/usr/bin/adb -s emulator-5554 shell getprop ro.product.cpu.abilist | tr -d '\r')"
            echo "Guest primary ABI: $(/usr/bin/adb -s emulator-5554 shell getprop ro.product.cpu.abi | tr -d '\r')"
          } | tee build/emulator-test/native-arm64-device.txt

          GUEST_ABIS="$(/usr/bin/adb -s emulator-5554 shell getprop ro.product.cpu.abilist | tr -d '\r')"
          [[ "$GUEST_ABIS" == *"arm64-v8a"* ]]
          [[ "$GUEST_ABIS" != *"x86"* ]]

          set +e
          bash scripts/test-on-emulator.sh build/output/eldrum-untold-infinite-health.apks "input/$PACKAGE_ASSET"
          TEST_STATUS=$?
          set -e
          echo "$TEST_STATUS" > build/emulator-test/test-exit-code.txt
          exit "$TEST_STATUS"

      - name: Upload native ARM64 startup diagnostics even when installation or launch fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eldrum-startup-diagnostics-native-arm64
          path: build/emulator-test/**
          retention-days: 14
          if-no-files-found: warn
